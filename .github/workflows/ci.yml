name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The manual is published independently of this repo, so drift can appear
  # without anyone pushing. Mondays at 07:00 UTC.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, tests and docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Also checks test/types.test-d.ts, where the type-level assertions live.
      - name: Typecheck
        run: bun run typecheck

      # The later steps run even after a failure, so one push reports every
      # problem rather than only the first.
      - name: Tests
        if: ${{ !cancelled() }}
        run: bun test

      # Two things at once: the build fails on an undocumented export or a
      # stale {@link} (validation warnings are errors), and the committed
      # docs/ has to match what it produces, since that folder is what gets
      # mirrored into the wiki. Output is reproducible because typedoc.json
      # pins source links to the branch rather than the commit.
      - name: Docs
        if: ${{ !cancelled() }}
        run: |
          bun run docs
          if [ -n "$(git status --porcelain -- docs)" ]; then
            echo "::error::docs/ is out of date. Run 'bun run docs' and commit the result."
            git status --short -- docs | head -20
            exit 1
          fi

  schema:
    name: Schema check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Fetches https://stonestoryrpg.com/stonescript/beta.html and fails if a
      # generated file is stale, or if the manual and StoneScriptAPI disagree
      # about a member or a return type.
      #
      # The manual is published independently of this repo, so drift is rarely
      # the fault of the commit being tested. A push or pull request is
      # therefore told about it without being failed; the weekly run opens an
      # issue instead. Only a deliberate manual run fails outright.
      - name: Check the schema against the Stonescript manual
        id: schema
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          set -o pipefail
          bun run schema:check 2>&1 | tee schema-report.txt

      - name: Summarise the drift
        if: ${{ steps.schema.outcome == 'failure' }}
        run: |
          {
            echo "### Schema drift"
            echo
            echo "The typed schema and the Stonescript manual disagree."
            echo
            echo '```'
            cat schema-report.txt
            echo '```'
            echo
            echo "Run \`bun run schema:sync\` to regenerate, then resolve anything it still reports."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Schema drift::The typed schema and the Stonescript manual disagree — see the run summary."

      # A weekly run has no commit to attribute the drift to and nobody
      # watching it, so it leaves something durable behind instead.
      - name: Open an issue for the drift
        if: ${{ steps.schema.outcome == 'failure' && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open_issue=$(gh issue list --label schema-drift --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$open_issue" ]; then
            echo "Issue #$open_issue is already open for this; not filing another."
            exit 0
          fi

          {
            echo "\`bun run schema:check\` found that the typed schema no longer matches"
            echo "[the Stonescript manual](https://stonestoryrpg.com/stonescript/beta.html)."
            echo
            echo '```'
            cat schema-report.txt
            echo '```'
            echo
            echo "## What to do"
            echo
            echo "1. \`bun run schema:sync\` regenerates \`src/schema/ids.ts\` and refreshes the"
            echo "   descriptions in \`src/schema/api.ts\`."
            echo "2. Anything it still reports needs a decision: add the member to"
            echo "   \`StoneScriptAPI\` with its argument list, or record why it is excluded in"
            echo "   \`NOT_IN_REGISTRY\` / \`NOT_IN_MANUAL\` in \`scripts/sync-schema.ts\`."
            echo "3. Argument lists are not checked automatically — skim the manual's diff for"
            echo "   signatures that changed without being renamed."
            echo
            echo "Found by [this run]($RUN_URL)."
          } > issue-body.md

          gh label create schema-drift \
            --color D93F0B \
            --description "The typed schema and the Stonescript manual disagree" || true

          gh issue create \
            --title "Schema drift: the Stonescript manual has moved on" \
            --label schema-drift \
            --body-file issue-body.md

  wiki:
    name: Publish docs/ to the wiki
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only after the checks pass: the docs step is what guarantees docs/ matches
    # the sources, and publishing documentation for a broken commit is worse
    # than publishing nothing.
    needs: checks
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main')
          || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, so the previous commit can be diffed against.
          fetch-depth: 0

      - name: Did docs/ change?
        id: docs
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A manual run republishes unconditionally. So does anything without
          # a usable previous commit — a first push, or a force-push that
          # rewrote it away. The sync itself is a no-op when nothing differs,
          # so erring towards running it is cheap.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || [ -z "${BEFORE:-}" ] \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$BEFORE" "$AFTER" -- docs; then
            echo "docs/ is unchanged since ${BEFORE}; leaving the wiki alone."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BEFORE" "$AFTER" -- docs | head -5
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mirror docs/ into the wiki repository
        if: ${{ steps.docs.outputs.changed == 'true' }}
        env:
          WIKI_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          wiki_url="https://x-access-token:${WIKI_TOKEN}@github.com/${REPOSITORY}.wiki.git"

          # GitHub only creates the wiki repository once a first page has been
          # saved, and there is no API for that. That is a setup step nobody has
          # done yet rather than a problem with this commit, so it reports
          # loudly and stops instead of failing the build.
          if ! git ls-remote "$wiki_url" >/dev/null 2>&1; then
            echo "::warning title=Wiki not published::The wiki repository does not exist yet — see the run summary."
            {
              echo "### Wiki not published"
              echo
              echo "\`docs/\` changed, but \`${REPOSITORY}.wiki.git\` does not exist yet."
              echo "GitHub only creates it once a first page has been saved, and there is"
              echo "no API for that:"
              echo
              echo "1. Open the repository's **Wiki** tab and save any page. The content"
              echo "   does not matter — this sync replaces it."
              echo "2. Re-run this workflow, or push anything that touches \`docs/\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git clone --quiet "$wiki_url" wiki
          cd wiki

          # Which branch to publish to. Wikis were created with a 'master'
          # default for years and newer ones follow the account default, so it
          # is read from the remote rather than assumed. A wiki whose HEAD
          # points at a branch that does not exist yet clones as empty, which
          # would otherwise produce an unrelated history and a rejected push.
          branch=$(git symbolic-ref --quiet --short HEAD || echo "")
          if ! git rev-parse --verify --quiet HEAD >/dev/null; then
            existing=$(git ls-remote --heads origin \
              | awk 'NR == 1 { sub("refs/heads/", "", $2); print $2 }')
            if [ -n "$existing" ]; then
              git fetch --quiet origin "$existing"
              git checkout --quiet -B "$existing" FETCH_HEAD
              branch="$existing"
            else
              branch=${branch:-master}
              git checkout --quiet -B "$branch"
            fi
          fi
          echo "Publishing to wiki branch: $branch"

          # Mirror rather than merge, so a page that stops being generated
          # stops existing.
          git rm -rq --ignore-unmatch .
          cp -R ../docs/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "The wiki already matches docs/; nothing to publish."
            exit 0
          fi

          git diff --cached --stat | tail -3
          git commit -q -m "Publish docs from ${SOURCE_SHA}"
          git push --quiet origin "HEAD:${branch}"
          echo "Published to https://github.com/${REPOSITORY}/wiki"
