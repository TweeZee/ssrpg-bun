name: Wiki

# A GitHub wiki is a separate git repository (<repo>.wiki.git), so the
# generated docs/ folder has to be mirrored into it. The wiki is generated
# output: anything edited by hand in it is overwritten by the next sync.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

# Two syncs pushing to the same wiki repository would race.
concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    name: Publish docs/ to the wiki
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Mirror docs/ into the wiki repository
        env:
          WIKI_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          wiki_url="https://x-access-token:${WIKI_TOKEN}@github.com/${REPOSITORY}.wiki.git"

          # GitHub only creates the wiki repository once a first page has been
          # saved, and there is no API for that.
          if ! git ls-remote "$wiki_url" >/dev/null 2>&1; then
            echo "::error::The wiki repository does not exist yet. Enable Wikis under" \
                 "Settings -> Features, open the Wiki tab and save any page, then re-run" \
                 "this workflow. The first page's content does not matter — this sync" \
                 "replaces it."
            exit 1
          fi

          git clone --quiet "$wiki_url" wiki
          cd wiki

          # Which branch to publish to. Wikis were created with a 'master'
          # default for years and newer ones follow the account default, so it
          # is read from the remote rather than assumed. A wiki whose HEAD
          # points at a branch that does not exist yet clones as empty, which
          # would otherwise produce an unrelated history and a rejected push.
          branch=$(git symbolic-ref --quiet --short HEAD || echo "")
          if ! git rev-parse --verify --quiet HEAD >/dev/null; then
            existing=$(git ls-remote --heads origin \
              | awk 'NR == 1 { sub("refs/heads/", "", $2); print $2 }')
            if [ -n "$existing" ]; then
              git fetch --quiet origin "$existing"
              git checkout --quiet -B "$existing" FETCH_HEAD
              branch="$existing"
            else
              branch=${branch:-master}
              git checkout --quiet -B "$branch"
            fi
          fi
          echo "Publishing to wiki branch: $branch"

          # Mirror rather than merge, so a page that stops being generated
          # stops existing.
          git rm -rq --ignore-unmatch .
          cp -R ../docs/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "The wiki already matches docs/; nothing to publish."
            exit 0
          fi

          git diff --cached --stat | tail -3
          git commit -q -m "Publish docs from ${SOURCE_SHA}"
          git push --quiet origin "HEAD:${branch}"
          echo "Published to https://github.com/${REPOSITORY}/wiki"
